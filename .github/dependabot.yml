version: 2

updates:
  # Cargo dependencies (root workspace covers all crates, once they have any).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keep the actions used in .github/workflows/ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
