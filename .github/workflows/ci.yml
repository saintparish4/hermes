name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately absent: it triples CI time for a Linux-deployed binary.
        # Add it back only if Windows artifacts ever ship.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and components; this installs exactly that.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # --all-targets so test code is linted too; the cognitive-complexity gate configured in
      # clippy.toml is worth nothing if it skips half the workspace.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No network in any test: every one is pure or backed by sqlite::memory:.
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --locked
