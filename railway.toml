"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"

[deploy]
# /healthz answers without touching SQLite, which is the point: a health check that queries
# the database gets the container killed during a scan, on exactly the runs that matter most.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
